name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint, type-check, tests, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Real Postgres service above — tests/integration/** needs a live DB
      # with migrations applied (see the "Apply migrations" step below).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Prisma's postinstall client generation is not guaranteed to run under
      # every npm install policy (see TASKS.md, Task 0.4 note) — generate explicitly.
      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run build

      - run: npm test

      - name: Install Playwright browser (Chromium only)
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
